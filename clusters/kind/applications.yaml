---
aptVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: slurm-operator
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./applications/slurm-operator/base
  prune: true
  force: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cert-manager
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: slurm
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./applications/slurm/base
  prune: true
  force: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: slurm-operator
