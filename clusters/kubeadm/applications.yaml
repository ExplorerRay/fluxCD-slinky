---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: slurm-operator
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./applications/slurm-operator/overlays/kubeadm
  prune: true
  force: false
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cert-manager
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: slurm-database
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./applications/slurm-database/overlays/kubeadm
  prune: true
  force: false
  wait: true
  timeout: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: mariadb-operator
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: slurm
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./applications/slurm/overlays/kubeadm
  prune: true
  force: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: slurm-operator
    - name: slurm-database
