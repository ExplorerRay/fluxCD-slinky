accounting:
  enabled: true

sssd:
  secretRef:
    name: slurm-sssd-conf
    key: sssd.conf

# The only documented switch for nss_slurm (see nss_slurm.html). Compute-side
# resolution itself needs no configuration: the slurmd image's stock
# /etc/nsswitch.conf already lists `slurm` on both passwd and group.
controller:
  extraConfMap:
    LaunchParameters: enable_nss_slurm

loginsets:
  slinky:
    # `port` has no chart or CRD default - omitting it drops the port from the
    # LoginSet CR entirely, so it stays even though it looks like a default.
    service:
      port: 22
      nodePort: 32222
      spec:
        type: NodePort
    podSpec:
      volumes:
        - name: freeipa-ca
          configMap:
            name: freeipa-ca
    login:
      volumeMounts:
        - name: freeipa-ca
          mountPath: /etc/ipa/ca.crt
          subPath: ca.crt

# Chart 1.2.x renders no NodeSet and no PartitionName line unless both keys are
# declared. An empty body is enough; per-set defaults come from nodesetDefaults.
nodesets:
  slinky: {}

partitions:
  all:
    enabled: true
