---
# ⚠️  DEV ONLY — hardcoded plaintext bind password committed to git. Acceptable
# ONLY for this proof-of-concept; keep secrets out of git for production. The
# ldap_default_authtok below must match the freeipa-admin Secret password.
#
# Full SSSD config consumed by the Slinky slurm chart via
# sssd.secretRef: {name: slurm-sssd-conf, key: sssd.conf}.
apiVersion: v1
kind: Secret
metadata:
  name: slurm-sssd-conf
  namespace: slurm
type: Opaque
stringData:
  sssd.conf: |
    [sssd]
    services = nss,pam
    domains = freeipa
    [nss]
    filter_groups = root,slurm
    filter_users = root,slurm
    [pam]
    [domain/freeipa]
    id_provider = ldap
    ldap_uri = ldaps://ipa.freeipa.svc.cluster.local
    ldap_search_base = dc=freeipa,dc=svc,dc=cluster,dc=local
    ldap_default_bind_dn = uid=admin,cn=users,cn=accounts,dc=freeipa,dc=svc,dc=cluster,dc=local
    ldap_default_authtok = SlinkyDevKind
    ldap_tls_reqcert = demand
    ldap_tls_cacert = /etc/ipa/ca.crt
    auth_provider = ldap
    chpass_provider = ldap
    cache_credentials = true
