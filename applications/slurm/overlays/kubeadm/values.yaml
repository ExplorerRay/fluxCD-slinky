# https://github.com/SlinkyProject/slurm-operator/blob/main/helm/slurm/values.yaml
accounting:
  enabled: true

# SSSD authenticates login and compute pods against the in-cluster FreeIPA
# server over LDAPS. The full sssd.conf is supplied by the slurm-sssd-conf
# Secret (see secret.yaml — DEV ONLY plaintext) rather than inline.
sssd:
  secretRef:
    name: slurm-sssd-conf
    key: sssd.conf

# Mount the FreeIPA CA certificate into every login and compute pod so SSSD can
# validate the LDAPS server certificate (ldap_tls_reqcert = demand). The
# freeipa-ca ConfigMap is created out-of-band during bootstrap by extracting
# /etc/ipa/ca.crt from the FreeIPA pod (see docs/bootstrap.md), and MUST exist
# before slurm pods start or the mount leaves them Pending.
loginsetDefaults:
  podSpec:
    volumes:
      - name: freeipa-ca
        configMap:
          name: freeipa-ca
  login:
    volumeMounts:
      - name: freeipa-ca
        mountPath: /etc/ipa/ca.crt
        subPath: ca.crt

nodesetDefaults:
  podSpec:
    volumes:
      - name: freeipa-ca
        configMap:
          name: freeipa-ca
  slurmd:
    volumeMounts:
      - name: freeipa-ca
        mountPath: /etc/ipa/ca.crt
        subPath: ca.crt

loginsets:
  slinky:
    enabled: true
    replicas: 1
    service:
      spec:
        type: NodePort
        port: 22
        nodePort: 32222
