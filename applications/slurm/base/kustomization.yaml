---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: slurm
resources:
  - namespace.yaml
  - helmrelease.yaml
  - home-pvc.yaml
# Fixed name: the overlay values.yaml references it verbatim.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  # The login image's common-session with pam_mkhomedir enabled, generated by
  # `pam-auth-update --enable mkhomedir` in the 26.05-ubuntu26.04 image plus
  # `skel=/etc/skel umask=0077`. Re-diff it when the login image changes.
  - name: slurm-login-pam
    files:
      - common-session=pam/common-session
