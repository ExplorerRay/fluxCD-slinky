accounting:
  enabled: true

sssd:
  secretRef:
    name: slurm-sssd-conf
    key: sssd.conf

# The switch nss_slurm.html prescribes: it makes slurmctld look up and send
# passwd/group details in the launch credential, and enables the
# `scontrol getent <node>` diagnostic.
# Ref: https://slurm.schedmd.com/nss_slurm.html
#
# It is not, however, what makes identity resolve here. The slurmd image's
# stock /etc/nsswitch.conf already lists `slurm` on passwd and group, and the
# operator hardcodes AuthInfo=use_client_ids, which populates the credential
# from the login client - resolution was measured working with this flag
# absent. It is set anyway, as the documented and portable mechanism, so that
# identity does not rest solely on an operator-side constant this repo cannot
# pin. See docs/runtime-requirements.md.
controller:
  extraConfMap:
    LaunchParameters: enable_nss_slurm

loginsets:
  slinky:
    # `port` has no chart or CRD default - omitting it drops the port from the
    # LoginSet CR entirely, so it stays even though it looks like a default.
    service:
      port: 22
      nodePort: 32222
      spec:
        type: NodePort
    podSpec:
      # Helm replaces lists wholesale; keep every volume here.
      # Never set securityContext.fsGroup: with the CephFS CSI FSGroupPolicy
      # (File), kubelet would recursively chown every user's home.
      volumes:
        - name: freeipa-ca
          configMap:
            name: freeipa-ca
        - name: home
          persistentVolumeClaim:
            claimName: slurm-home
        - name: pam-common-session  # enables pam_mkhomedir
          configMap:
            name: slurm-login-pam
      # Keep /home root-owned 0755 so no user can pre-create another's home.
      initContainers:
        - name: home-perms
          image: docker.io/library/alpine:3.24.2  # pinned: :latest means imagePullPolicy Always
          command:
            - /bin/sh
            - -c
            - chown 0:0 /home && chmod 0755 /home
          volumeMounts:
            - name: home
              mountPath: /home
    login:
      volumeMounts:
        - name: freeipa-ca
          mountPath: /etc/ipa/ca.crt
          subPath: ca.crt
        - name: home
          mountPath: /home
        - name: pam-common-session
          mountPath: /etc/pam.d/common-session
          subPath: common-session
          readOnly: true

# Chart 1.2.x renders no NodeSet and no PartitionName line unless both keys are
# declared. An empty body is enough; per-set defaults come from nodesetDefaults.
#
# Do NOT add `ssh: {enabled: true}` here without reading this first. It is the
# gate for ssh-to-compute via pam_slurm_adopt, and it does two things that are
# probably not wanted:
#   1. nodeset-cr.yaml injects `sssdConfRef` inside its `if .enabled` block, so
#      every compute pod receives the FreeIPA bind credential. Job identity has
#      no need of it - nss_slurm covers that (docs/runtime-requirements.md).
#   2. On chart 1.2.1 it breaks the install outright. nodesetDefaults carries
#      `ssh.extraSshdConfig: null`, nodeset-cr.yaml toYaml's the whole ssh dict
#      into the CR, and the CRD types that field as `string`, so the NodeSet is
#      rejected with `spec.ssh.extraSshdConfig: Invalid value: "null"` and no
#      worker pod is ever created. Override extraSshdConfig with a string if
#      the gate really is needed. (loginset-cr.yaml guards the same field with
#      `with`, which is why login sets are unaffected.)
nodesets:
  slinky:
    # Same shared /home as the login pod (same fsGroup caveat).
    podSpec:
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: slurm-home
    slurmd:
      volumeMounts:
        - name: home
          mountPath: /home

partitions:
  all:
    enabled: true
