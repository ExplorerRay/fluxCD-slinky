---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: slurm-operator
spec:
  interval: 10m0s
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: slurm-operator-values
      valuesKey: values.yaml
  chart:
    spec:
      chart: slurm-operator
      version: 1.2.x
      sourceRef:
        kind: HelmRepository
        name: slinky
        namespace: flux-system
