---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: freeipa-ca-export
  namespace: slurm
---
# Server-side apply needs `create` for a new object; the name pins it too.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: freeipa-ca-export
  namespace: slurm
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [freeipa-ca]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: freeipa-ca-export
  namespace: slurm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: freeipa-ca-export
subjects:
  - kind: ServiceAccount
    name: freeipa-ca-export
    namespace: slurm
