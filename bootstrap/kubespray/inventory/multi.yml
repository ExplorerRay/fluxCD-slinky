---
# Multi-node inventory: node1 is the control-plane + etcd; node2 and node3 are
# dedicated workers. node1 is NOT in kube_node, so Kubespray applies the
# control-plane NoSchedule taint and ordinary workloads land on the workers.
all:
  hosts:
    node1:
      ansible_host: 192.168.0.1
      ip: 192.168.0.1
    node2:
      ansible_host: 192.168.0.2
      ip: 192.168.0.2
    node3:
      ansible_host: 192.168.0.3
      ip: 192.168.0.3
  children:
    kube_control_plane:
      hosts:
        node1:
    kube_node:
      hosts:
        node2:
        node3:
    etcd:
      hosts:
        node1:
    k8s_cluster:
      children:
        kube_control_plane:
        kube_node:
