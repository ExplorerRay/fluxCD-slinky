---
# Single-node inventory: one host runs control-plane, etcd, and worker roles.
# Because the node is also in kube_node, Kubespray provisions it as schedulable
# (no NoSchedule control-plane taint), so all workloads run on it.
all:
  hosts:
    node1:
      ansible_host: localhost  # replace with the node's reachable address
      ip: 127.0.0.1            # replace with the node's IP
  children:
    kube_control_plane:
      hosts:
        node1:
    kube_node:
      hosts:
        node1:
    etcd:
      hosts:
        node1:
    k8s_cluster:
      children:
        kube_control_plane:
        kube_node:
