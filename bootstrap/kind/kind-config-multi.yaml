kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
    # Mount the host loop device (and its backing image) into this worker so
    # Rook-Ceph can use it as the single dev-grade OSD. The host-side device is
    # created by bootstrap/kind/setup.sh before `kind create cluster`.
    extraMounts:
      - hostPath: /dev/loop100
        containerPath: /dev/loop100
        propagation: HostToContainer
      - hostPath: /var/lib/rook
        containerPath: /var/lib/rook
        propagation: HostToContainer
      # Host /dev (devtmpfs) so device nodes for freshly mapped RBD volumes
      # appear in the node; kind's own /dev is a static tmpfs and `rbd map`
      # fails with "/dev/rbdX is not accessible" without this.
      - hostPath: /dev
        containerPath: /dev
        propagation: HostToContainer
  - role: worker
    extraMounts:
      - hostPath: /dev
        containerPath: /dev
        propagation: HostToContainer
