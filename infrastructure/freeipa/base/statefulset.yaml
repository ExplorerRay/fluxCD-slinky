---
# In-cluster FreeIPA identity server (single replica). Hand-rolled because there
# is no maintained FreeIPA Helm chart. The image runs systemd as PID 1
# (freeipa-container), so it needs the systemd-in-container accommodations below.
#
# DEV ONLY: this runs PRIVILEGED but inside a user namespace (hostUsers:
# false). Privileged gives systemd + FreeIPA (389-ds, Dogtag CA) the mount and
# cgroup access they need; the user namespace confines those capabilities so
# they cannot reach host-global kernel state.
#
# The user namespace is LOAD-BEARING, not just hardening. SELinux policy is a
# single, non-namespaced, kernel-global resource. systemd (PID 1) always calls
# libselinux selinux_init_load_policy(), which UNCONDITIONALLY does
# `mount("selinuxfs", "/sys/fs/selinux", ...)` and reloads policy — masking
# that path with a tmpfs does not help, because the mount stacks a fresh live
# selinuxfs on top and succeeds whenever the process holds CAP_SYS_ADMIN over
# the host. On a privileged host-user pod this reloads the IMAGE's policy into
# the HOST kernel, unmapping the host's container-* types and breaking
# docker/containerd host-wide (observed: docker.sock became unlabeled_t, every
# docker command denied). selinuxfs is not a userns-mountable filesystem, so
# under hostUsers: false that mount fails with EPERM, systemd logs "Unable to
# load SELinux policy. Ignoring." and boots normally — the host is untouched.
# On non-SELinux hosts (Debian/AppArmor) there is no policy to touch, so this
# is a clean no-op there too.
#
# This mirrors how freeipa-container's own rootless-podman CI runs. Needs
# Kubernetes user-namespace support (GA since v1.33; kindest/node v1.36 has it)
# and cgroup v2 on the host. See the README security note.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ipa
  namespace: freeipa
spec:
  serviceName: ipa
  replicas: 1
  selector:
    matchLabels:
      app: freeipa
  template:
    metadata:
      labels:
        app: freeipa
    spec:
      # FreeIPA needs its own FQDN to resolve to itself. Combined with the
      # headless Service, ipa.freeipa.svc.cluster.local resolves via CoreDNS.
      hostname: ipa
      subdomain: ipa
      # Run the pod in its own user namespace. Confines the privileged
      # container's capabilities so they cannot mutate host-global kernel state
      # (see the SELinux note above). Container UID 0 maps to an unprivileged
      # host UID.
      hostUsers: false
      containers:
        - name: freeipa
          # Pinned Rocky 9 build of the upstream freeipa-server image.
          image: quay.io/freeipa/freeipa-server:rocky-9-4.13.1
          # No command/args: the image's systemd init (/usr/local/sbin/init)
          # runs ipa-server-install from IPA_SERVER_INSTALL_OPTS. Passing
          # `ipa-server-install` as args would replace systemd (PID 1) and
          # break the install. The user namespace (hostUsers: false above) is
          # what neutralizes systemd's host SELinux policy reload — see the
          # header note; no entrypoint wrapper is needed or effective.
          env:
            # Sets both the Directory Manager and admin passwords.
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: freeipa-admin
                  key: password
            # The server FQDN (matches the headless Service DNS name).
            - name: IPA_SERVER_HOSTNAME
              value: ipa.freeipa.svc.cluster.local
            # Arguments passed straight to ipa-server-install.
            #   -U                unattended
            #   -r <REALM>        Kerberos realm
            #   --domain          IPA primary DNS domain
            #   --no-host-dns     do not check host DNS during install
            #   --no-ntp          do not configure chrony/NTP
            # NOTE: integrated DNS is intentionally OFF — no --setup-dns.
            - name: IPA_SERVER_INSTALL_OPTS
              value: >-
                -U
                -r FREEIPA.SVC.CLUSTER.LOCAL
                --domain=freeipa.svc.cluster.local
                --no-host-dns
                --no-ntp
            # Do not try to update DNS A records (integrated DNS is off).
            - name: IPA_SERVER_IP
              value: no-update
          securityContext:
            # Privileged for systemd's mount/cgroup needs; confined by the
            # pod's user namespace (hostUsers: false) so it cannot reach
            # host-global kernel state.
            privileged: true
          # RHEL IdM sizing docs recommend 4 GB RAM for the smallest deployment
          # tier (up to 10,000 users); install-time (Dogtag CA + 389-ds) is the
          # peak. The limit must also cover the memory-backed emptyDirs below
          # (/run, /tmp, /dev/shm), which count against it.
          # https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/installing_identity_management/preparing-the-system-for-ipa-server-installation_installing-identity-management
          resources:
            requests:
              memory: "2Gi"
            limits:
              memory: "4Gi"
          ports:
            - containerPort: 389
              protocol: TCP
            - containerPort: 636
              protocol: TCP
            - containerPort: 88
              protocol: TCP
            - containerPort: 88
              protocol: UDP
            - containerPort: 464
              protocol: TCP
            - containerPort: 464
              protocol: UDP
            - containerPort: 80
              protocol: TCP
            - containerPort: 443
              protocol: TCP
          volumeMounts:
            # Persistent IPA state (config, LDAP DB, CA, certs).
            - name: data
              mountPath: /data
            # NOTE: no /sys/fs/cgroup hostPath mount. Under a user namespace
            # the host cgroup tree would be owned by an unmapped UID and
            # systemd could not write to it. With cgroup v2 the container
            # runtime delegates a correctly-owned cgroup subtree at
            # /sys/fs/cgroup automatically (cgroupns=private), which systemd
            # uses directly.
            # systemd + services need writable /run and /tmp.
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
            # 389-ds needs shared memory.
            - name: dev-shm
              mountPath: /dev/shm
          # First install takes several minutes; probe generously.
          readinessProbe:
            exec:
              command:
                - /usr/bin/systemctl
                - status
                - ipa
            initialDelaySeconds: 120
            timeoutSeconds: 10
            periodSeconds: 15
            failureThreshold: 40
      volumes:
        - name: run
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir:
            medium: Memory
        - name: dev-shm
          emptyDir:
            medium: Memory
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-block
        resources:
          requests:
            storage: 10Gi
