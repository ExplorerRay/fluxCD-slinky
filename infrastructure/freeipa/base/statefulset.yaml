---
# In-cluster FreeIPA identity server (single replica). Hand-rolled because there
# is no maintained FreeIPA Helm chart. The image runs systemd as PID 1
# (freeipa-container), so it needs cgroup + mount access.
#
# DEV ONLY. This uses the USER-NAMESPACE model: hostUsers: false runs the pod in
# its own user namespace and the container is NON-privileged with NO added
# capabilities at all. The user namespace is what makes that possible, and it is
# also what keeps the container away from host-global kernel state — critically,
# it cannot reload the image's SELinux policy into the shared host kernel.
# (SELinux policy is a single, kernel-global resource; an UNCONFINED
# CAP_SYS_ADMIN lets the container's systemd/tools mount selinuxfs and load the
# image's policy into the HOST kernel, unmapping the host's container-* types and
# breaking docker/containerd host-wide — observed: docker.sock -> unlabeled_t,
# every docker command denied. The user namespace is what prevents this.)
#
# ⚠️ REQUIRES HOST KERNEL >= 6.3. On older kernels — e.g. RHEL/Rocky/AlmaLinux
# 9.x, which ship a frozen 5.14 kernel — a hostUsers: false pod FAILS at sandbox
# creation with `mounting "sysfs" to rootfs at "/sys": operation not permitted`
# and FreeIPA never starts. It also needs containerd >= 2.1 with
# cgroup_writable = true, and under kind the /sys masking worked around
# (kind #3436) — both are implemented in bootstrap/kind/, see docs/bootstrap.md
# (FreeIPA runtime notes). For older-kernel hosts the alternative is a privileged
# pod with the host in SELinux permissive.
#
# Follows freeipa-container's upstream user-namespace deployment
# (tests/freeipa-k8s.yaml).
#
# VERIFIED WORKING on 2026-08-06, single-node kind, with exactly this manifest:
#   host kernel     6.12.100+deb13-amd64 (Debian 13 trixie, no SELinux)
#   kind            v0.32.0
#   node image      kindest/node:v1.36.1 (Kubernetes v1.36.1)
#   containerd      v2.3.1 on the node, cgroup_writable = true
#   image           quay.io/freeipa/freeipa-server:rocky-9-4.13.1
# Evidence: pod ipa-0 reached 1/1 Ready ~8m40s after start;
#   `kubectl -n freeipa get pod ipa-0 -o jsonpath='{.spec.hostUsers} {.spec.containers[0].securityContext}'`
#     -> false {"privileged":false}
#   `cat /proc/self/uid_map` in-container -> `0 1325727744 65536` (real userns)
#   `ipactl status` -> all 7 services RUNNING (Directory Service, krb5kdc,
#   kadmin, httpd, ipa-custodia, pki-tomcatd, ipa-otpd).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ipa
  namespace: freeipa
spec:
  serviceName: ipa
  replicas: 1
  selector:
    matchLabels:
      app: freeipa
  template:
    metadata:
      labels:
        app: freeipa
    spec:
      # FreeIPA needs its own FQDN to resolve to itself. Combined with the
      # headless Service, ipa.freeipa.svc.cluster.local resolves via CoreDNS.
      hostname: ipa
      subdomain: ipa
      # Run the pod in its own user namespace. Confines the privileged
      # container's capabilities so they cannot mutate host-global kernel state
      # (see the SELinux note above). Container UID 0 maps to an unprivileged
      # host UID.
      hostUsers: false
      containers:
        - name: freeipa
          # Pinned Rocky 9 build of the upstream freeipa-server image.
          image: quay.io/freeipa/freeipa-server:rocky-9-4.13.1
          # No command/args: the image's systemd init (/usr/local/sbin/init)
          # runs ipa-server-install from IPA_SERVER_INSTALL_OPTS. Passing
          # `ipa-server-install` as args would replace systemd (PID 1) and
          # break the install. The user namespace (hostUsers: false above) is
          # what neutralizes systemd's host SELinux policy reload — see the
          # header note; no entrypoint wrapper is needed or effective.
          env:
            # Sets both the Directory Manager and admin passwords.
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: freeipa-admin
                  key: password
            # The server FQDN (matches the headless Service DNS name).
            - name: IPA_SERVER_HOSTNAME
              value: ipa.freeipa.svc.cluster.local
            # Arguments passed straight to ipa-server-install.
            #   -U                unattended
            #   -r <REALM>        Kerberos realm
            #   --domain          IPA primary DNS domain
            #   --no-host-dns     do not check host DNS during install
            #   --no-ntp          do not configure chrony/NTP
            # NOTE: integrated DNS is intentionally OFF — no --setup-dns.
            - name: IPA_SERVER_INSTALL_OPTS
              value: >-
                -U
                -r FREEIPA.SVC.CLUSTER.LOCAL
                --domain=freeipa.svc.cluster.local
                --no-host-dns
                --no-ntp
            # Do not try to update DNS A records (integrated DNS is off).
            - name: IPA_SERVER_IP
              value: no-update
          securityContext:
            # NON-privileged with ZERO added capabilities — the same model as
            # freeipa-container's upstream user-namespace deployment
            # (tests/freeipa-k8s.yaml). Inside the user namespace, PID-1 systemd
            # needs no extra capability: containerd delegates a writable cgroup
            # subtree (cgroup_writable, see bootstrap/kind/kind-config-single.yaml)
            # and the emptyDirs below supply the writable /run, /tmp and /dev/shm
            # systemd would otherwise have to mount itself.
            #
            # DO NOT ADD CAP_SYS_ADMIN. Verified: adding it BREAKS the install.
            # With SYS_ADMIN the server installs fine but the final
            # ipa-client-install step fails with
            #   KerberosError: No valid Negotiate header in server response
            # and httpd's error_log shows
            #   auth_gssapi:error GSS ERROR gss_acquire_cred[_from]() failed to
            #   get server creds: ... (SPNEGO cannot find mechanisms to negotiate)
            # then ipa-server-install rolls the whole thing back. Reproduced
            # twice with SYS_ADMIN; removing it (changing nothing else) made the
            # same manifest install cleanly. The capability lets systemd apply
            # per-service sandboxing (PrivateTmp and friends) that it silently
            # skips without it, which breaks the /tmp-based ccache handoff
            # between httpd and gssproxy.
            #
            # readOnlyRootFilesystem is also NOT usable here, even though
            # upstream sets it: upstream runs under podman, which materialises
            # the image's `VOLUME` declarations, while Kubernetes ignores them.
            # With a read-only rootfs the image's init dies immediately on
            #   cp: cannot create regular file '/etc/hosts.dist': Read-only file system
            privileged: false
          # RHEL IdM sizing docs recommend 4 GB RAM for the smallest deployment
          # tier (up to 10,000 users); install-time (Dogtag CA + 389-ds) is the
          # peak. The limit must also cover the memory-backed emptyDirs below
          # (/run, /tmp, /dev/shm), which count against it.
          # https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/9/html/installing_identity_management/preparing-the-system-for-ipa-server-installation_installing-identity-management
          resources:
            requests:
              memory: "2Gi"
            limits:
              memory: "4Gi"
          ports:
            - containerPort: 389
              protocol: TCP
            - containerPort: 636
              protocol: TCP
            - containerPort: 88
              protocol: TCP
            - containerPort: 88
              protocol: UDP
            - containerPort: 464
              protocol: TCP
            - containerPort: 464
              protocol: UDP
            - containerPort: 80
              protocol: TCP
            - containerPort: 443
              protocol: TCP
          volumeMounts:
            # Persistent IPA state (config, LDAP DB, CA, certs).
            - name: data
              mountPath: /data
            # NOTE: no /sys/fs/cgroup hostPath mount. Under a user namespace
            # the host cgroup tree would be owned by an unmapped UID and
            # systemd could not write to it. With cgroup v2 the container
            # runtime delegates a correctly-owned cgroup subtree at
            # /sys/fs/cgroup automatically (cgroupns=private), which systemd
            # uses directly.
            # systemd + services need writable /run and /tmp.
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
            # 389-ds needs shared memory.
            - name: dev-shm
              mountPath: /dev/shm
          # First install takes several minutes; probe generously.
          readinessProbe:
            exec:
              command:
                - /usr/bin/systemctl
                - status
                - ipa
            initialDelaySeconds: 120
            timeoutSeconds: 10
            periodSeconds: 15
            failureThreshold: 40
      volumes:
        - name: run
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir:
            medium: Memory
        - name: dev-shm
          emptyDir:
            medium: Memory
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-block
        resources:
          requests:
            storage: 10Gi
