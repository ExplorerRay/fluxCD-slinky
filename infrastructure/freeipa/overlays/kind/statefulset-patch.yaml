---
# kind runs inside Docker on a developer workstation: shrink the data PVC.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ipa
  namespace: freeipa
spec:
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ceph-block
        resources:
          requests:
            storage: 5Gi
