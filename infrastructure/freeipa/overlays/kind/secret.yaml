# password. See the security note in the repo README.
#
# Holds the FreeIPA admin + Directory Manager password. The freeipa-server
# container reads it via env PASSWORD (secretKeyRef below); the same value maps
# to `ipa-server-install --admin-password` and `--ds-password`.
apiVersion: v1
kind: Secret
metadata:
  name: freeipa-admin
  namespace: freeipa
type: Opaque
stringData:
  password: SlinkyDevKind
