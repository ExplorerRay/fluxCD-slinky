---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rook-ceph
resources:
  - namespace.yaml
  - helmrelease-operator.yaml
  - helmrelease-cluster.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: rook-ceph-cluster-values
    files:
      - values.yaml
