---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  interval: 10m0s
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: rook-ceph
      version: v1.15.x
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
        namespace: flux-system
  values:
    # Every cluster variant backs its OSD with a loopback device
    # (/dev/loop100); the operator rejects loop devices unless this test-only
    # opt-in is set (default false — the osd-prepare job then skips the device
    # with "unsupported diskType loop").
    allowLoopDevices: true
