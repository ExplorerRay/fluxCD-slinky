---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rook-ceph
resources:
  - ../kubeadm
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: rook-ceph-cluster-node-values
    files:
      - node-values.yaml
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: rook-ceph-cluster
    patch: |-
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: rook-ceph-cluster-node-values
          valuesKey: node-values.yaml
