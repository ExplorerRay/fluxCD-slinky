---
# Values for the rook-ceph-cluster Helm chart, shared by both kubeadm variants
# (kubeadm-single, kubeadm-multi).
#
# Dev-grade, single-node Ceph: one mon, one mgr, one OSD backed by a loopback
# device over a sparse file (/dev/loop100). Exposes two StorageClasses:
# ceph-block (RBD, ReadWriteOnce, the cluster default) and ceph-filesystem
# (CephFS, ReadWriteMany, backing the shared Slurm /home). No RGW.
#
# The OSD node placement (cephClusterSpec.storage.nodes) is NOT set here — it
# differs per variant and is supplied by a second HelmRelease valuesFrom entry
# layered on top by overlays/kubeadm-single or overlays/kubeadm-multi (see
# their node-values.yaml).
#
# Storage upgrade path: once >=3 real nodes with real disks exist, replace the
# /dev/loop100 device entry below with real disk/LV names, bump
# cephBlockPools[].spec.replicated.size to 3, and change failureDomain to host.
# Do the same for the CephFS pools and set activeStandby to true.

# Enable the toolbox so `ceph status` can be run from within the cluster.
toolbox:
  enabled: true

# Prometheus is not installed yet; disable monitoring integration.
monitoring:
  enabled: false

# Cluster-wide ceph.conf overrides. Cap OSD memory on the constrained node.
# osd_memory_target matches Ceph's own documented default (4GB); 2GB is only
# the documented floor to never go below, not a recommendation.
# https://docs.ceph.com/en/reef/start/hardware-recommendations/
configOverride: |
  [osd]
  osd_memory_target = 4294967296

cephClusterSpec:
  # Pin the Ceph image. The rook-ceph-cluster v1.15.x chart defaults to Ceph
  # v18.2.4, whose mon deterministically deadlocks in OSDMonitor::prepare_update
  # on ANY `osd pool create`: the dispatch thread blocks holding the Monitor
  # lock (0 CPU, admin socket dead), so the CephBlockPool never reaches Ready
  # and every ceph-block PVC stays Pending forever. Fixed in v18.2.7 (verified
  # on the kind variant). Do NOT drop back to v18.2.4.
  cephVersion:
    image: quay.io/ceph/ceph:v18.2.7
  mon:
    count: 1
    allowMultiplePerNode: true
  mgr:
    count: 1
    allowMultiplePerNode: true
  dashboard:
    enabled: true
  # Modest resource requests/limits for the single constrained node.
  # mgr sits above the rook-ceph-cluster chart defaults (and above the kind
  # overlay) since kubeadm nodes are real machines — the chart-default 1Gi
  # limit is the floor below which the mgr gets OOM-killed at startup.
  resources:
    mgr:
      requests:
        cpu: "100m"
        memory: "1Gi"
      limits:
        memory: "2Gi"
    # Requests are what the scheduler reserves, and the whole stack's requests
    # must fit in one node's allocatable memory (bootstrap/kubespray/README.md).
    # They are therefore sized for this dev cluster's idle footprint; the
    # limits keep the burst headroom. mon idles around 0.5Gi.
    mon:
      requests:
        cpu: "200m"
        memory: "1Gi"
      limits:
        memory: "4Gi"
    # osd request equals osd_memory_target (4GiB), the size the OSD's caches
    # grow to under load; requesting less would make it an eviction candidate.
    # The limit matches Ceph's documented "~8GB per BlueStore OSD" advisory.
    osd:
      requests:
        cpu: "250m"
        memory: "4Gi"
      limits:
        memory: "8Gi"
  storage:
    useAllNodes: false
    useAllDevices: false
    # nodes list is supplied per-variant via the overlay's node-values.yaml
    # (overlays/kubeadm-single, overlays/kubeadm-multi).

# One replicated pool exposing the default ceph-block StorageClass.
cephBlockPools:
  - name: ceph-blockpool
    spec:
      failureDomain: osd
      replicated:
        size: 1
    storageClass:
      enabled: true
      name: ceph-block
      isDefault: true
      reclaimPolicy: Delete
      allowVolumeExpansion: true
      parameters:
        imageFormat: "2"
        imageFeatures: layering
        # CSI credentials for provision/expand/node-stage. These come from the
        # chart's default parameters and MUST be restored when overriding the
        # parameters map (Helm replaces it wholesale) — without them the
        # provisioner fails with "provided secret is empty" and PVCs never bind.
        csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
        csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
        csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
        csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
        csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
        csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
        csi.storage.k8s.io/fstype: ext4

# CephFS for the shared Slurm /home (PVC slurm-home); RBD is ReadWriteOnce.
# Helm replaces the chart's list entry wholesale, so every field is set here.
cephFileSystems:
  - name: ceph-filesystem
    spec:
      metadataPool:
        failureDomain: osd
        replicated:
          size: 1
      dataPools:
        - name: data0  # rendered as pool ceph-filesystem-data0
          failureDomain: osd
          replicated:
            size: 1
      # Keep the filesystem and pools if the CR is deleted.
      preserveFilesystemOnDelete: true
      metadataServer:
        activeCount: 1
        # Rook always adds one standby per active MDS (2 pods); false makes it
        # a cold standby rather than standby-replay.
        activeStandby: false
        # No priorityClassName: the chart default system-cluster-critical lets
        # the MDS preempt workloads on a full node (observed evicting ipa-0 on a
        # 20GiB kubeadm-single node). At default priority it waits Pending.
        # Per MDS pod. Rook sets mds_cache_memory_limit to half the limit, so
        # the cache is sized by the limit, not the request. The request only
        # reserves the idle footprint (measured 46Mi active, 30Mi standby).
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            memory: "2Gi"
    storageClass:
      enabled: true
      name: ceph-filesystem
      isDefault: false
      pool: data0
      reclaimPolicy: Retain  # home data must outlive the claim
      allowVolumeExpansion: true
      volumeBindingMode: Immediate
      # Helm replaces this map wholesale; the CSI secrets must be restored.
      parameters:
        csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
        csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
        csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
        csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
        csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
        csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph

# Deferred to later work: no object store.
cephObjectStores: []
