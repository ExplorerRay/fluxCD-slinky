---
# Per-variant OSD node placement, the last HelmRelease valuesFrom entry
# (see base/helmrelease-cluster.yaml; Helm replaces the whole nodes list).
# The node name MUST match the Kubernetes node hostname for this variant.
cephClusterSpec:
  storage:
    nodes:
      - name: "kind-control-plane"  # single-node kind: the control-plane is schedulable
        devices:
          - name: "/dev/loop100"  # loopback device mounted into the kind node; see bootstrap/kind
