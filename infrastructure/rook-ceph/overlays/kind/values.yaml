---
# Values for the rook-ceph-cluster Helm chart, shared by both kind variants
# (kind-single, kind-multi).
#
# Dev-grade, single-node Ceph: one mon, one mgr, one OSD backed by a loopback
# device over a sparse file (/dev/loop100, mounted into the kind node). BLOCK-
# ONLY: exposes a single ceph-block RBD StorageClass set as the cluster default.
# No CephFS, no RGW. Requests are smaller than the kubeadm overlay since kind
# runs inside Docker on a developer workstation.
#
# The OSD node placement (cephClusterSpec.storage.nodes) is NOT set here — it
# differs per variant and is supplied by a second HelmRelease valuesFrom entry
# layered on top by overlays/kind-single or overlays/kind-multi (see their
# node-values.yaml).
#
# Storage upgrade path: once >=3 real nodes with real disks exist, replace the
# /dev/loop100 device entry below with real disk/LV names, bump
# cephBlockPools[].spec.replicated.size to 3, and change failureDomain to host.

# Enable the toolbox so `ceph status` can be run from within the cluster.
toolbox:
  enabled: true

# Prometheus is not installed yet; disable monitoring integration.
monitoring:
  enabled: false

# Cluster-wide ceph.conf overrides. Cap OSD memory on the constrained node.
configOverride: |
  [osd]
  osd_memory_target = 2147483648

cephClusterSpec:
  mon:
    count: 1
    allowMultiplePerNode: true
  mgr:
    count: 1
    allowMultiplePerNode: true
  dashboard:
    enabled: true
  # Smaller requests/limits than kubeadm for the local Docker-backed node.
  resources:
    mgr:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        memory: "384Mi"
    mon:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        memory: "384Mi"
    osd:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        memory: "2Gi"
  storage:
    useAllNodes: false
    useAllDevices: false
    # nodes list is supplied per-variant via the overlay's node-values.yaml
    # (overlays/kind-single, overlays/kind-multi).

# BLOCK-ONLY: one replicated pool exposing the default ceph-block StorageClass.
cephBlockPools:
  - name: ceph-blockpool
    spec:
      failureDomain: osd
      replicated:
        size: 1
    storageClass:
      enabled: true
      name: ceph-block
      isDefault: true
      reclaimPolicy: Delete
      allowVolumeExpansion: true
      parameters:
        imageFormat: "2"
        imageFeatures: layering
        csi.storage.k8s.io/fstype: ext4

# Deferred to later work: no CephFS, no object store.
cephFileSystems: []
cephObjectStores: []
