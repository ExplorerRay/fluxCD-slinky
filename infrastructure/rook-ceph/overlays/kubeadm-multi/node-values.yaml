---
# Per-variant OSD node placement, the last HelmRelease valuesFrom entry
# (see base/helmrelease-cluster.yaml; Helm replaces the whole nodes list).
# The node name MUST match the Kubernetes node hostname for this variant.
cephClusterSpec:
  storage:
    nodes:
      - name: "node2"  # first worker in bootstrap/kubespray/inventory/multi.yml; install the rook-osd-loop systemd unit on this host
        devices:
          - name: "/dev/loop100"  # loopback device created at boot; see bootstrap/rook-ceph
